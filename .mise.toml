[env]
_.path = "{{ config_root }}/bin"
_.python.venv = { path = "{{ config_root }}/.venv", create = true }
ANSIBLE_HOME = "{{ config_root }}/.ansible"
ANSIBLE_INVENTORY = "{{ config_root }}/.config/inventory.yml"
ANSIBLE_FILTER_PLUGINS = "{{ config_root }}/.config/filter_plugins"
SOPS_AGE_KEY_FILE = "{{ config_root }}/.age-keys/master.age"
SOPS_CONFIG = "{{ config_root }}/.config/.sops.yml"
# TODO: enable only for a certain playbook (required by lookup purelymail ownership code because macos bug)
OBJC_DISABLE_INITIALIZE_FORK_SAFETY = "YES"

[task_config]
dir = "{{ config_root }}"
includes = [".config/tasks.mise.toml"]

[tools]
actionlint = "1.7.12"
apkeep = "0.18.0"
age = "1.3.1"
dive = "0.13.1"
dockle = "0.4.15"
envsubst = "1.4.3"
grype = "0.116.1"
jq = "1.8.2"
python = "3.14.7"
rg = "15.2.0"
shellcheck = "0.11.0"
shfmt = "3.13.1"
sops = "3.13.3"
typos = "1.49.0"
uv = "0.12.3"
zizmor = "1.29.0"

[tool_alias]
zizmor = "asdf:vic1707/asdf-zizmor"
apkeep = "asdf:vic1707/asdf-any-cargo-quickinstall"

[settings.python]
compile = false     ## Forces download of precompiled bin
uv_venv_auto = "create|source"

[hooks]
postinstall = [
	"uv sync",
	"ansible-galaxy install --force -r .config/requirements.yml",
]

[settings]
experimental = true
