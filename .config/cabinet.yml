---
cabinet_ports:
    fedex:
        rj45_1: eth0 # 20:7c:14:f7:24:3d
        rj45_2: eth1 # 20:7c:14:f7:24:3e
        rj45_3: eth2 # 20:7c:14:f7:24:3f
        rj45_4: eth3 # 20:7c:14:f7:24:40
        rj45_5: eth4 # 20:7c:14:f7:24:41
        sfp6: eth5 # 20:7c:14:f7:24:42
        sfp7: eth6 # 20:7c:14:f7:24:43
        sfp8: eth7 # 20:7c:14:f7:24:44
        sfp9: eth8 # 20:7c:14:f7:24:45
    mycelium:
        copper1: 1/1/1
        copper2: 1/1/2
        copper3: 1/1/3
        copper38: 1/1/38
        copper44: 1/1/44
        copper46: 1/1/46
        copper48: 1/1/48
        x1: 1/2/1
        x2: 1/2/2
        x3: 1/2/3
        x4: 1/2/4

cabinet_links:
    bbox_wan:
        state: active
        fedex: sfp6
        peer: Bouygues ONT
    fedex_rescue:
        state: on_demand
        fedex: rj45_5
        peer: management client
    fedex_mycelium:
        state: active
        fedex: sfp8
        mycelium: x1
    user_test:
        state: active
        mycelium: copper3
        peer: temporary USER client
    bacon:
        state: active
        mycelium: copper38
        peer: Bacon AP
        networks:
            - mgmt
            - user
            - iot_offline
            - untrusted
    home_assistant:
        state: active
        mycelium: copper44
        peer: Home Assistant
    slzb_1:
        state: active
        mycelium: copper46
        peer: SLZB hub 1
    slzb_2:
        state: active
        mycelium: copper48
        peer: SLZB hub 2

mycelium_interface_profiles:
    parking: &parking
        mode: access
        access_vlan: 999
        admin_state: down
    mgmt: &mgmt
        mode: access
        access_vlan: 10
        admin_state: up

mycelium_interfaces:
    - name: 1/1/1
      <<: *parking
    - name: 1/1/2 # copper2, MGMT access/recovery
      <<: *mgmt
      description: mgmt
    - name: 1/1/3 # copper3, temporary USER test port
      description: user-test
      mode: access
      access_vlan: "{{ active_networks | selectattr('name', 'equalto', 'user') | map(attribute='vlan_id') | first }}"
      admin_state: up
    - name: 1/1/4
      <<: *mgmt
      description: mgmt
    - name: 1/1/5
      <<: *parking
    - name: 1/1/6
      <<: *mgmt
      description: mgmt
    - name: 1/1/7
      <<: *parking
    - name: 1/1/8
      <<: *mgmt
      description: mgmt
    - name: 1/1/9
      <<: *parking
    - name: 1/1/10
      <<: *mgmt
      description: mgmt
    - name: 1/1/11
      <<: *parking
    - name: 1/1/12
      <<: *mgmt
      description: mgmt
    - name: 1/1/13
      <<: *parking
    - name: 1/1/14
      <<: *parking
    - name: 1/1/15
      <<: *parking
    - name: 1/1/16
      <<: *parking
    - name: 1/1/17
      <<: *parking
    - name: 1/1/18
      <<: *parking
    - name: 1/1/19
      <<: *parking
    - name: 1/1/20
      <<: *parking
    - name: 1/1/21
      <<: *parking
    - name: 1/1/22
      <<: *parking
    - name: 1/1/23
      <<: *parking
    - name: 1/1/24
      <<: *parking
    - name: 1/1/25
      <<: *parking
    - name: 1/1/26
      <<: *parking
    - name: 1/1/27
      <<: *parking
    - name: 1/1/28
      <<: *parking
    - name: 1/1/29
      <<: *parking
    - name: 1/1/30
      <<: *parking
    - name: 1/1/31
      <<: *parking
    - name: 1/1/32
      <<: *parking
    - name: 1/1/33
      <<: *parking
    - name: 1/1/34
      <<: *parking
    - name: 1/1/35
      <<: *parking
    - name: 1/1/36
      <<: *parking
    - name: 1/1/37
      <<: *parking
    - name: 1/1/38 # copper38, Bacon AP
      description: bacon
      mode: trunk
      allowed_vlans: >-
          {{ active_networks
              | selectattr('name', 'in', cabinet_links.bacon.networks)
              | map(attribute='vlan_id')
              | list
          }}
      admin_state: up
      poe:
          enabled: true
    - name: 1/1/39
      <<: *parking
    - name: 1/1/40
      <<: *parking
    - name: 1/1/41
      <<: *parking
    - name: 1/1/42
      <<: *parking
    - name: 1/1/43
      <<: *parking
    - name: 1/1/44 # copper44, Home Assistant
      description: home-assistant
      mode: access
      access_vlan: "{{ active_networks | selectattr('name', 'equalto', 'automation') | map(attribute='vlan_id') | first }}"
      admin_state: up
    - name: 1/1/45
      <<: *parking
    - name: 1/1/46 # copper46, SLZB hub 1
      description: slzb-1
      mode: access
      access_vlan: "{{ active_networks | selectattr('name', 'equalto', 'automation') | map(attribute='vlan_id') | first }}"
      admin_state: up
      poe:
          enabled: true
    - name: 1/1/47
      <<: *parking
    - name: 1/1/48 # copper48, SLZB hub 2
      description: slzb-2
      mode: access
      access_vlan: "{{ active_networks | selectattr('name', 'equalto', 'automation') | map(attribute='vlan_id') | first }}"
      admin_state: up
      poe:
          enabled: true
    - name: 1/2/1 # X1, Fedex SFP8
      description: fedex-mgmt
      mode: trunk
      allowed_vlans: "{{ active_networks | rejectattr('name', 'equalto', 'parking') | map(attribute='vlan_id') | list }}"
      admin_state: up
    - name: 1/2/2 # X2
      <<: *parking
    - name: 1/2/3 # X3
      <<: *parking
    - name: 1/2/4 # X4
      <<: *parking


# Physical management 1 remains disconnected and is reserved for the later OOB phase.
