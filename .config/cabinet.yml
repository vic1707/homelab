---
cabinet_ports:
    fedex:
        rj45_1: eth0 # 20:7c:14:f7:24:3d
        rj45_2: eth1 # 20:7c:14:f7:24:3e
        rj45_3: eth2 # 20:7c:14:f7:24:3f
        rj45_4: eth3 # 20:7c:14:f7:24:40
        rj45_5: eth4 # 20:7c:14:f7:24:41
        sfp6: eth5 # 20:7c:14:f7:24:42
        sfp7: eth6 # 20:7c:14:f7:24:43
        sfp8: eth7 # 20:7c:14:f7:24:44
        sfp9: eth8 # 20:7c:14:f7:24:45
    mycelium:
        copper1: 1/1/1
        copper2: 1/1/2
        copper38: 1/1/38
        x1: 1/2/1
        x2: 1/2/2
        x3: 1/2/3
        x4: 1/2/4

cabinet_links:
    bbox_wan:
        state: active
        fedex: sfp6
        peer: Bouygues ONT
    fedex_rescue:
        state: on_demand
        fedex: rj45_2
        peer: administration laptop
    temp_lan:
        state: active
        fedex: sfp7
        peer: legacy LAN
    fedex_mycelium:
        state: active
        fedex: sfp8
        mycelium: x1
    admin_laptop:
        state: on_demand
        mycelium: copper2
        peer: administration laptop
    bacon:
        state: planned
        mycelium: copper38
        peer: Bacon AP

mycelium_interfaces:
    - <<: &parking
          mode: access
          access_vlan: 999
          admin_state: down
      name: 1/1/1
    - <<: &mgmt
          mode: access
          access_vlan: 10
          admin_state: up
      name: 1/1/2 # copper2, administration laptop
      description: admin-mgmt
