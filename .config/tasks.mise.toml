actionlint = "actionlint"

ansible-lint = "rg --files --hidden -0 | xargs -0 -r -t ansible-lint -c .config/.ansible-lint.yml -x yaml"
"ansible-lint:fix" = "ansible-lint -c .config/.ansible-lint.yml --fix"

ansible-syntax-check = "rg --files -g '*.playbook.yml' | xargs -r -t ansible-playbook --syntax-check"
network-conflicts = "ANSIBLE_DISPLAY_OK_HOSTS=false ansible-playbook -i localhost, .config/networks.validate.playbook.yml"

shellcheck = "rg --ignore --hidden -l '^#!.*\\b(sh|bash|dash|ksh|ash)(\\s|$)' . | xargs -r -t shellcheck -a -Calways"

shfmt = "shfmt -d --apply-ignore -s -bn -ci -sr -kp ."
"shfmt:fix" = "shfmt -w --apply-ignore -s -bn -ci -sr -kp ."

typos = "typos -c .config/.typos.toml"

zizmor = "zizmor ."


[format]
depends = ["shfmt"]

["format:fix"]
depends = ["shfmt:fix"]

[ci-lint]
depends = ["zizmor", "actionlint"]

[lint]
depends = ["ansible-lint", "ansible-syntax-check", "network-conflicts", "typos", "shellcheck"]

["lint:fix"]
depends = ["ansible-lint:fix"]
