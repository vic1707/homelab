---
# Shared network-registry preflight. Included as a pre_task by every device
# playbook and by networks.validate.playbook.yml. Requires networks.yml and
# cabinet.yml vars.
- name: .config | networks.validate.tasks | Validate network registry
  ansible.builtin.assert:
      that:
          - network_names | unique | length == network_names | length
          - network_vlan_ids | unique | length == network_vlan_ids | length
          - network_vlan_ids | intersect(network_forbidden_vlan_ids) | length == 0
          - network_subnets | overlapping_networks | length == 0
      fail_msg: >-
          network registry conflict: duplicate network names or VLAN ids,
          a VLAN id collides with a forbidden id, or subnets overlap
  vars:
      network_names: "{{ networks | map(attribute='name') | list }}"
      network_vlan_ids: "{{ networks | map(attribute='vlan_id') | list }}"
      network_subnets: >-
          {{ networks | map(attribute='subnet') | reject('none') | list + network_forbidden_subnets.values() | list }}

- name: .config | networks.validate.tasks | Validate cabinet network references
  ansible.builtin.assert:
      that: mycelium_interfaces | length == 52
      fail_msg: cabinet must define all 48 copper and 4 SFP switch interfaces
