---
- name: Validate shared network intent
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
      - networks.yml
      - cabinet.yml
      - ../devices/fedex/vars/static_hosts.yml
      - ../devices/fedex/vars/firewall.yml

  vars:
      firewall_errors: >-
          {{ firewall_zones
              | firewall_config_errors(
                  static_hosts,
                  networks,
                  firewall_nut_clients,
                  firewall_feature_sections
              )
          }}

  tasks:
      - name: Validate network registry
        ansible.builtin.import_tasks: networks.validate.tasks.yml

      - name: Validate Fedex firewall intent
        ansible.builtin.assert:
            that: firewall_errors | length == 0
            fail_msg: "{{ firewall_errors | join('; ') }}"
