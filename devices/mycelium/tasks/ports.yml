---
- name: ports | Validate explicit port overrides
  vars:
      port_roles: >-
          {{ mycelium_ports.values() | map(attribute='role', default=mycelium_port_defaults.role) | list }}
  ansible.builtin.assert:
      that:
          - mycelium_ports.keys() | difference(mycelium_port_names) | length == 0
          - port_roles | difference(['mgmt', 'parking']) | length == 0
          - mycelium_interface_intent is sequence
          - mycelium_interface_intent | select('mapping') | length == mycelium_interface_intent | length
