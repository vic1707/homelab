# RVLoader default settings for Gamecube games (Nintendont)
# Copy to USB:/rvloader/defaults/gc.cfg
# Every value below equals RVLoader's built-in default: change only what you need.
# Values are decimal integers (no hex). 0 = No, 1 = Yes.

# 0 / 1
Force progressive = 0
Force widescreen = 0
# Ignored (always on) when "Force widescreen" is enabled
Force RVL-DD stretching = 0
Native SI = 0
Enable Cheats = 0
Memory Card Emulation = 1

# Auto = 0, NTSC = 65540, PAL50 = 65537, PAL60 = 65538, MPAL = 65544
Video mode = 0

# Auto = -1, English = 0, German = 1, French = 2, Spanish = 3, Italian = 4, Dutch = 5
Language = -1

# 1 to 4
Max Pads = 4

# Auto = 0, or a width from 640 to 720
Video Width = 0

# GC+2.0 button mapping (only used when a GC+2.0 is detected).
# Each entry says which physical button triggers that button. Every value must be used exactly once.
# Left = 1, Right = 2, Down = 4, Up = 8, Z = 16, R = 32, L = 64,
# A = 256, B = 512, X = 1024, Y = 2048, Start = 4096
GCPMap_A = 256
GCPMap_B = 512
GCPMap_X = 1024
GCPMap_Y = 2048
GCPMap_UP = 8
GCPMap_DOWN = 4
GCPMap_RIGHT = 2
GCPMap_LEFT = 1
GCPMap_Z = 16
GCPMap_R = 32
GCPMap_L = 64
GCPMap_START = 4096
