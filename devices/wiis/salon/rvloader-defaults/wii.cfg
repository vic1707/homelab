# RVLoader default settings for Wii games (Hiidra)
# Copy to USB:/rvloader/defaults/wii.cfg
# Settings not listed here inherit RVLoader's built-in defaults.
# Values are decimal integers (no hex).

# 0 / 1
Enable USB saves = 1

# 0 = No, 1 = Yes, 2 = Auto (enabled when the WiFi card is detected at game launch)
Enable WiFi = 0

# 0 / 1
Enable Bluetooth = 1
Enable GC2Wiimote = 0
Enable Cheats = 0

# 0 / 1. The built-in default depends on the hardware: 0 when an MX chip (RTC) is
# detected, 1 otherwise. Uncomment only to force one value for every title.
# Patch MX chip = 1

# Auto = 0, Bypass = 1, Redirect = 2
PADRead Mode = 0

# Auto = 0, OFF (Safe) = 1, OFF (Extended) = 2, ON (Low) = 3, ON (Medium) = 4, ON (High) = 5
Deflicker Mode = 1

# VBI = 1, KPADRead = 2, Joypad = 3, GXDraw = 4, GXFlush = 5, OSSleepThread = 6, AXNextFrame = 7
Cheats Hooktype = 1
