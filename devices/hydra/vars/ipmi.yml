---
ipmi_factory_username: >-
    {{ lookup('community.sops.sops', '../../.secrets/devices/hydra.yml', extract='["bmc"]["factory"]["username"]') | trim }}

ipmi_factory_password: >-
    {{ lookup('community.sops.sops', '../../.secrets/devices/hydra.yml', extract='["bmc"]["factory"]["password"]') | trim }}

ipmi_accounts: >-
    {{ lookup('community.sops.sops', '../../.secrets/devices/hydra.yml', extract='["bmc"]["accounts"]') | from_yaml }}

ipmi_administrator_id: >-
    {{ lookup('community.sops.sops', '../../.secrets/devices/hydra.yml', extract='["bmc"]["administrator"]["id"]') | string }}

ipmi_username: >-
    {{ lookup('community.sops.sops', '../../.secrets/devices/hydra.yml', extract='["bmc"]["administrator"]["username"]') | trim }}

ipmi_password: >-
    {{ lookup('community.sops.sops', '../../.secrets/devices/hydra.yml', extract='["bmc"]["administrator"]["password"]') | trim }}
