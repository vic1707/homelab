---
- name: Manage Hydra BMC over Redfish
  hosts: hydra_ipmi
  connection: local
  gather_facts: false

  vars_files:
      - vars/ipmi.yml

  module_defaults:
      community.general.redfish_info: &redfish_defaults
          baseuri: "{{ ansible_host }}"
          username: "{{ ipmi_username }}"
          password: "{{ ipmi_password }}"
          validate_certs: false
      community.general.redfish_config:
          <<: *redfish_defaults
      community.general.redfish_command:
          <<: *redfish_defaults
      ansible.builtin.uri:
          url_username: "{{ ipmi_username }}"
          url_password: "{{ ipmi_password }}"
          force_basic_auth: true
          validate_certs: false
          return_content: true

  pre_tasks:
      - name: Hydra IPMI | Check BMC reachability
        ansible.builtin.wait_for:
            host: "{{ ansible_host }}"
            port: 443
            connect_timeout: 3
            timeout: 10
            msg: Hydra BMC is not reachable at {{ ansible_host }}:443.
        tags: always

      - name: Hydra IPMI | Validate credentials
        ansible.builtin.assert:
            that:
                - ipmi_username | length > 0
                - ipmi_username != ipmi_factory_username
                - ipmi_account_ids | unique | length == ipmi_account_ids | length
                - ipmi_usernames | unique | length == ipmi_usernames | length
                - ipmi_passwords | unique | length == ipmi_passwords | length
                - ipmi_password_lengths | min >= 12
                - ipmi_password_lengths | max <= 20
                - >-
                    ipmi_passwords
                    | select('match', '.*[A-Z].*')
                    | length == ipmi_passwords | length
            fail_msg: >-
                BMC account IDs, usernames, and passwords must be unique;
                passwords must contain 12-20 characters including an uppercase letter.
        vars:
            ipmi_account_ids: >-
                {{ [ipmi_administrator_id]
                   + (ipmi_accounts | map(attribute='id') | map('string') | list) }}
            ipmi_usernames: >-
                {{ [ipmi_factory_username, ipmi_username]
                   + (ipmi_accounts | map(attribute='username') | list) }}
            ipmi_passwords: >-
                {{ [ipmi_password] + (ipmi_accounts | map(attribute='password') | list) }}
            ipmi_password_lengths: "{{ ipmi_passwords | map('length') | list }}"
        no_log: true
        tags: always

  tasks:
      - name: Hydra IPMI | Configure BMC
        ansible.builtin.import_tasks: tasks/bmc.yml
        tags: bmc

      - name: Hydra IPMI | Configure fans
        ansible.builtin.import_tasks: tasks/bmc/fans.yml
        vars:
            fan_mode: Optimal # Standard, FullSpeed, Optimal, or HeavyIO.
        tags: fans

      - name: Hydra IPMI | Configure BIOS
        ansible.builtin.import_tasks: tasks/bios.yml
        tags: bios
