---
- name: Manage Hydra BMC over Redfish
  hosts: hydra_ipmi
  connection: local
  gather_facts: false

  vars_files:
      - vars/ipmi.yml

  module_defaults:
      community.general.redfish_info: &redfish_defaults
          baseuri: "{{ ansible_host }}"
          username: "{{ ipmi_username }}"
          password: "{{ ipmi_password }}"
          validate_certs: false
      community.general.redfish_config:
          <<: *redfish_defaults
      community.general.redfish_command:
          <<: *redfish_defaults
      ansible.builtin.uri:
          url_username: "{{ ipmi_username }}"
          url_password: "{{ ipmi_password }}"
          force_basic_auth: true
          validate_certs: false
          return_content: true

  pre_tasks:
      - name: Hydra IPMI | Check BMC reachability
        ansible.builtin.wait_for:
            host: "{{ ansible_host }}"
            port: 443
            connect_timeout: 3
            timeout: 10
            msg: Hydra BMC is not reachable at {{ ansible_host }}:443.
        tags: always

      - name: Hydra IPMI | Validate credentials
        ansible.builtin.assert:
            that:
                - ipmi_username | length > 0
                - ipmi_factory_password | length >= 8
                - ipmi_password | length >= 12
                - ipmi_password | length <= 20
                - ipmi_account_usernames | unique | length == ipmi_account_usernames | length
                - ipmi_account_passwords | unique | length == ipmi_account_passwords | length
                - ipmi_account_password_lengths | min >= 12
                - ipmi_account_password_lengths | max <= 20
            fail_msg: >-
                BMC usernames and passwords must be unique and passwords must contain 12-20 characters.
        vars:
            ipmi_account_usernames: "{{ [ipmi_username] + (ipmi_accounts | map(attribute='username') | list) }}"
            ipmi_account_passwords: "{{ [ipmi_password] + (ipmi_accounts | map(attribute='password') | list) }}"
            ipmi_account_password_lengths: "{{ ipmi_account_passwords | map('length') | list }}"
        no_log: true
        tags: always

  tasks:
      - name: Hydra IPMI | Configure BMC
        ansible.builtin.import_tasks: tasks/bmc.yml
        tags: bmc

      - name: Hydra IPMI | Configure fans
        ansible.builtin.import_tasks: tasks/bmc/fans.yml
        vars:
            fan_mode: Optimal # Standard, FullSpeed, Optimal, or HeavyIO.
        tags: fans

      - name: Hydra IPMI | Configure BIOS
        ansible.builtin.import_tasks: tasks/bios.yml
        tags: bios
