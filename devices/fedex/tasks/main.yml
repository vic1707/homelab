---
- name: Fedex | Update root password
  community.openwrt.command: # https://github.com/ansible-collections/community.openwrt/issues/143
      cmd: >-
          printf '%s\n%s\n' {{ root_password | quote }} {{ root_password | quote }} | passwd root
      uses_shell: true
  no_log: true
  when: fedex_update_root_password | default(false)

- name: Fedex | Keep firewall enabled
  community.openwrt.service:
      name: firewall
      enabled: true
      state: started

- name: Fedex | Restrict SSH to rescue
  community.openwrt.uci:
      command: set
      config: dropbear
      section: "@dropbear[0]"
      option: Interface
      value: rescue
      autocommit: true
  notify: Fedex | Restart dropbear

- name: Fedex | Expose SSH on management network
  community.openwrt.uci:
      command: section
      config: dropbear
      type: dropbear
      name: mgmt
      value:
          Interface: mgmt
          PasswordAuth: "off"
          RootPasswordAuth: "off"
          RootLogin: "on"
          Port: "22"
      replace: true
      autocommit: true
  notify: Fedex | Restart dropbear

- name: Fedex | Restrict LuCI to rescue and management
  community.openwrt.uci:
      command: section
      config: uhttpd
      type: uhttpd
      name: main
      value:
          listen_http:
              - 192.168.255.1:80
              - "{{ mgmt_network.gateway }}:80"
          listen_https:
              - 192.168.255.1:443
              - "{{ mgmt_network.gateway }}:443"
      replace: false
      autocommit: true
  notify: Fedex | Restart uhttpd

- name: Fedex | Ensure network globals section exists
  community.openwrt.uci:
      command: set
      key: network.globals
      value: globals
      autocommit: false

- name: Fedex | Disable packet steering
  community.openwrt.uci:
      command: set
      key: network.globals.packet_steering
      value: "0"
      autocommit: true
  notify: Fedex | Reload packet steering
