---
- name: features | ntp | Configure rule | {{ firewall_zone.name | upper }}
  community.openwrt.uci:
      command: section
      config: firewall
      type: rule
      name: "allow_{{ firewall_zone.name }}_ntp"
      value:
          src: "{{ firewall_zone.name }}"
          proto: udp
          dest_ip: "{{ firewall_gateway }}"
          dest_port: "123"
          target: ACCEPT
      replace: true
      autocommit: true
  notify: Fedex | Reload firewall
