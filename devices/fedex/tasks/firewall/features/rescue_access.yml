---
- name: features | rescue_access | Configure forwarding | {{ firewall_zone.name | upper }}
  community.openwrt.uci:
      command: section
      config: firewall
      type: forwarding
      name: "rescue_{{ firewall_zone.name }}"
      value:
          src: rescue
          dest: "{{ firewall_zone.name }}"
      replace: true
      autocommit: true
  notify: Fedex | Reload firewall
