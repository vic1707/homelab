---
- name: features | force_dns | Configure redirect | {{ firewall_zone.name | upper }}
  community.openwrt.uci:
      command: section
      config: firewall
      type: redirect
      name: "redirect_{{ firewall_zone.name }}_dns"
      value:
          src: "{{ firewall_zone.name }}"
          proto: [tcp, udp]
          src_dport: "53"
          dest_port: "53"
          target: DNAT
      replace: true
      autocommit: true
  notify: Fedex | Reload firewall
