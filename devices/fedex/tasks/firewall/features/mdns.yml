---
- name: features | mdns | Configure rule | {{ firewall_zone.name | upper }}
  community.openwrt.uci:
      command: section
      config: firewall
      type: rule
      name: "allow_{{ firewall_zone.name }}_mdns"
      value:
          src: "{{ firewall_zone.name }}"
          proto: udp
          dest_ip: 224.0.0.251
          dest_port: "5353"
          family: ipv4
          target: ACCEPT
      replace: true
      autocommit: true
  notify: Fedex | Reload firewall
