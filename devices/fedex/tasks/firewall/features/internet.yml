---
- name: features | internet | Configure forwarding | {{ firewall_zone.name | upper }}
  community.openwrt.uci:
      command: section
      config: firewall
      type: forwarding
      name: "{{ firewall_zone.name }}_wan"
      value:
          src: "{{ firewall_zone.name }}"
          dest: wan
      replace: true
      autocommit: true
  notify: Fedex | Reload firewall
