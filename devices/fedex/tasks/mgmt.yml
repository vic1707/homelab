---
- name: mgmt | Configure Mycelium trunk VLAN device
  community.openwrt.uci:
      command: section
      config: network
      type: device
      name: mgmt_vlan
      value:
          name: "{{ mycelium_trunk_device }}.{{ mgmt_network.vlan_id }}"
          type: 8021q
          ifname: "{{ mycelium_trunk_device }}"
          vid: "{{ mgmt_network.vlan_id }}"
      replace: true
      autocommit: true
  notify: Fedex | Reload network

- name: mgmt | Configure gateway
  community.openwrt.uci:
      command: section
      config: network
      type: interface
      name: mgmt
      value:
          device: "{{ mycelium_trunk_device }}.{{ mgmt_network.vlan_id }}"
          proto: static
          ipaddr: "{{ mgmt_network.gateway }}"
          netmask: "{{ mgmt_network.subnet | subnet_netmask }}"
          delegate: "0"
      replace: true
      autocommit: true
  notify: Fedex | Reload network

- name: mgmt | Configure DHCP
  community.openwrt.uci:
      command: section
      config: dhcp
      type: dhcp
      name: mgmt
      value:
          interface: mgmt
          start: "{{ mgmt_network.dhcp.start }}"
          limit: "{{ mgmt_network.dhcp.limit }}"
          leasetime: "{{ mgmt_network.dhcp.leasetime }}"
          dhcp_option:
              - "6,{{ mgmt_network.gateway }}"
      replace: true
      autocommit: true
  notify: Fedex | Restart dnsmasq

- name: mgmt | Apply network and management service changes
  ansible.builtin.meta: flush_handlers

- name: mgmt | Check management listeners
  community.openwrt.command:
      cmd: netstat -lnt
  register: mgmt_listeners
  changed_when: false

- name: mgmt | Activate missing management listeners
  community.openwrt.service:
      name: "{{ listener.name }}"
      state: restarted
  loop:
      - name: dropbear
        address: "{{ mgmt_network.gateway }}:22"
      - name: uhttpd
        address: "{{ mgmt_network.gateway }}:80"
  loop_control:
      label: "{{ listener.name }}"
      loop_var: listener
  when: listener.address not in mgmt_listeners.stdout
