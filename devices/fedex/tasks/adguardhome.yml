---
- name: adguardhome | Create configuration directory
  community.openwrt.file:
      path: /etc/adguardhome
      state: directory
      owner: adguardhome
      group: adguardhome
      mode: "0700"

- name: adguardhome | Configure AdGuard Home
  community.openwrt.template:
      src: adguardhome.yaml.j2
      dest: /etc/adguardhome/adguardhome.yaml
      owner: adguardhome
      group: adguardhome
      mode: "0600"
      validate: /usr/bin/AdGuardHome --check-config --config %s
  register: adguardhome_config
  no_log: true

- name: adguardhome | Cut over DNS
  block:
      - name: adguardhome | Move dnsmasq DNS to local backend port
        community.openwrt.uci:
            command: set
            config: dhcp
            section: "@dnsmasq[0]"
            option: port
            value: "5353"
            autocommit: true
        notify: Fedex | Restart dnsmasq

      - name: adguardhome | Keep dnsmasq queries local
        community.openwrt.uci:
            command: set
            config: dhcp
            section: "@dnsmasq[0]"
            option: noresolv
            value: "1"
            autocommit: true
        notify: Fedex | Restart dnsmasq

      - name: adguardhome | Apply dnsmasq port change
        ansible.builtin.meta: flush_handlers

      - name: adguardhome | Enable AdGuard Home
        community.openwrt.service:
            name: adguardhome
            enabled: true
            state: "{{ 'restarted' if adguardhome_config.changed else 'started' }}"

      - name: adguardhome | Verify DNS
        community.openwrt.command:
            cmd: >-
                for attempt in $(seq 1 15); do
                    nslookup openwrt.org 127.0.0.1 >/dev/null 2>&1 && exit 0;
                    sleep 2;
                done;
                exit 1
            uses_shell: true
        changed_when: false

  rescue:
      - name: adguardhome | Stop failed DNS service
        community.openwrt.service:
            name: adguardhome
            enabled: false
            state: stopped

      - name: adguardhome | Restore dnsmasq DNS port
        community.openwrt.uci:
            command: set
            config: dhcp
            section: "@dnsmasq[0]"
            option: port
            value: "53"
            autocommit: true

      - name: adguardhome | Restore dnsmasq upstream resolution
        community.openwrt.uci:
            command: absent
            config: dhcp
            section: "@dnsmasq[0]"
            option: noresolv
            autocommit: true

      - name: adguardhome | Restart restored DNS service
        community.openwrt.service:
            name: dnsmasq
            state: restarted

      - name: adguardhome | Report failed DNS cutover
        ansible.builtin.fail:
            msg: AdGuard Home DNS failed its health check; dnsmasq was restored on port 53.
