---
firewall_zones:
    - name: rescue
      features: [dhcp, dns, ping, router_management, mgmt_access]
      exceptions:
          allow_rescue_slzb_webui:
              origin: rescue
              destinations: [slzb_06u, slzb_mrw10u]
              ports: [80]
              protocols: [tcp]
          allow_rescue_tv_adb:
              origin: rescue
              destinations: [TV]
              ports: [5555]
              protocols: [tcp]

    - name: mgmt
      features: [dhcp, dns, ping]

    - name: user
      features: [dhcp, dns, ping, force_dns, block_dot_doq, internet, mdns]
      exceptions:
          allow_user_home_assistant:
              origin: user
              destinations: [homeassistant]
              ports: [8123]
              protocols: [tcp]
          allow_user_tv_airplay_tcp:
              origin: user
              destinations: [TV]
              ports: [554, 3689, 5000, 6000, 7000, 7001, 7100, 8612, 32768-65535]
              protocols: [tcp]
          allow_user_tv_airplay_udp:
              origin: user
              destinations: [TV]
              ports: [554, 6000-7000, 32768-65535]
              protocols: [udp]

    - name: automation
      features: [dhcp, dns, ping, force_dns, ntp, nut]
      exceptions:
          allow_home_assistant_slzb:
              origin: homeassistant
              destinations: [slzb_06u, slzb_mrw10u]
              ports: [80]
              protocols: [tcp]
          allow_home_assistant_wan:
              origin: homeassistant
              destinations: [wan]
          allow_home_assistant_hydra_redfish:
              origin: homeassistant
              destinations: [hydra_ipmi]
              ports: [443]
              protocols: [tcp]
          allow_home_assistant_yeelights:
              origin: homeassistant
              destinations: [yeelight_billard, yeelight_office, yeelight_bedroom, yeelight_tv]
              ports: [55443]
              protocols: [tcp]
          allow_home_assistant_x1c:
              origin: homeassistant
              destinations: [x1c]
              ports: [990, 6000, 8883]
              protocols: [tcp]

    - name: iot_offline
      features: [dhcp, dns, ping, force_dns, ntp]

    - name: iot_cloud
      features: [dhcp, dns, ping, force_dns, block_dot_doq, internet, mdns, ntp]
      exceptions:
          # AirPlay receivers negotiate reverse media streams to sender ephemeral ports.
          allow_tv_airplay_return:
              origin: TV
              destinations: [user]
              ports: [49152-65535]
              protocols: [tcp, udp]

    - name: untrusted
      features: [dhcp, dns, ping, force_dns, block_dot_doq, internet]

firewall_nut_clients: [homeassistant]

firewall_feature_sections:
    block_dot_doq: "block_%s_dot"
    dhcp: "allow_%s_dhcp"
    dns: "allow_%s_dns"
    force_dns: "redirect_%s_dns"
    internet: "%s_wan"
    mgmt_access: ["%s_mgmt", "%s_mgmt_masq"]
    mdns: "allow_%s_mdns"
    ntp: "allow_%s_ntp"
    nut: "allow_%s_nut"
    ping: "allow_%s_ping"
    router_management: "allow_%s_router"

firewall_managed_sections: "{{ firewall_zones | firewall_section_ids(firewall_feature_sections) }}"
