---
bbox_wan:
    ifname: "{{ fedex_interfaces.bbox_wan }}"
    vlan: 100
    device: "{{ fedex_interfaces.bbox_wan }}.100"
    vendorid: BYGTELIAD
    macaddr: >-
        {{ lookup('community.sops.sops', '../../.secrets/devices/fedex.yml', extract='["bbox"]["mac"]') | trim }}

root_password: >-
    {{ lookup('community.sops.sops', '../../.secrets/devices/fedex.yml', extract='["accounts"]["root"]["password"]') | trim }}

fedex_networks: "{{ networks | rejectattr('gateway', 'none') | list }}"
rescue_network: "{{ fedex_networks | selectattr('name', 'equalto', 'rescue') | first }}"
mgmt_network: "{{ fedex_networks | selectattr('name', 'equalto', 'mgmt') | first }}"
automation_network: "{{ fedex_networks | selectattr('name', 'equalto', 'automation') | first }}"
