---
- name: Manage fedex OpenWrt
  hosts: fedex
  gather_facts: false

  vars_files:
      - vars/openwrt.yml
      - vars/nut.yml
      - vars/adguardhome.yml

  pre_tasks:
      - name: Fedex | Check OpenWrt access
        community.openwrt.ping:

  tasks:
      - name: Fedex | Configure main settings
        ansible.builtin.import_tasks: tasks/main.yml

      - name: Fedex | Configure Bbox WAN
        ansible.builtin.import_tasks: tasks/wan.yml

      - name: Fedex | Configure temporary LAN
        ansible.builtin.import_tasks: tasks/temp_lan.yml

      - name: Fedex | Configure LAN policy
        ansible.builtin.import_tasks: tasks/lan_policy.yml

      - name: Fedex | Configure AdGuard Home
        ansible.builtin.import_tasks: tasks/adguardhome.yml

      - name: Fedex | Configure NUT
        ansible.builtin.import_tasks: tasks/nut.yml

  handlers:
      - name: Fedex | Reload network
        community.openwrt.service:
            name: network
            state: reloaded

      - name: Fedex | Reload firewall
        community.openwrt.service:
            name: firewall
            state: reloaded

      - name: Fedex | Restart dnsmasq
        community.openwrt.service:
            name: dnsmasq
            state: restarted

      - name: Fedex | Restart dropbear
        community.openwrt.service:
            name: dropbear
            state: restarted

      - name: Fedex | Restart uhttpd
        community.openwrt.service:
            name: uhttpd
            state: restarted

      - name: Fedex | Replay NUT USB hotplug
        community.openwrt.command:
            cmd: |
                for vendor_file in /sys/bus/usb/devices/*/idVendor; do
                    read -r vendorid < "$vendor_file"
                    device="${vendor_file%/idVendor}"
                    read -r productid < "$device/idProduct"
                    [ "$vendorid:$productid" = "{{ nut.ups.vendorid }}:{{ nut.ups.productid }}" ] || continue
                    printf '%s\n' add > "$device/uevent"
                done
            uses_shell: true

      - name: Fedex | Restart NUT server
        community.openwrt.service:
            name: nut-server
            state: restarted

      - name: Fedex | Restart NUT monitor
        community.openwrt.service:
            name: nut-monitor
            state: restarted
