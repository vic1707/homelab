---
- name: Manage fedex OpenWrt
  hosts: fedex
  gather_facts: false
  force_handlers: true

  vars_files:
      - ../../network/networks.yml
      - ../../network/cabinet.yml
      - vars/openwrt.yml
      - vars/static_hosts.yml
      - vars/firewall.yml
      - vars/nut.yml
      - vars/adguardhome.yml

  pre_tasks:
      - name: Fedex | Validate network registry
        ansible.builtin.import_tasks: ../../network/validate.tasks.yml

      - name: Fedex | Validate firewall intent
        ansible.builtin.import_tasks: ../../network/validate.firewall.tasks.yml

      - name: Fedex | Check OpenWrt access
        community.openwrt.ping:

  tasks:
      - name: Fedex | Configure main settings
        ansible.builtin.import_tasks: tasks/main.yml

      - name: Fedex | Configure Bbox WAN
        ansible.builtin.import_tasks: tasks/wan.yml

      - name: Fedex | Configure active routed networks
        ansible.builtin.import_tasks: tasks/networks.yml

      - name: Fedex | Configure static DHCP hosts
        ansible.builtin.import_tasks: tasks/static_hosts.yml

      - name: Fedex | Configure firewall zones
        ansible.builtin.import_tasks: tasks/zones.yml

      - name: Fedex | Configure mDNS reflection
        ansible.builtin.import_tasks: tasks/mdns.yml

      - name: Fedex | Configure AdGuard Home
        ansible.builtin.import_tasks: tasks/adguardhome.yml

      - name: Fedex | Configure NUT
        ansible.builtin.import_tasks: tasks/nut.yml

  handlers:
      - name: Fedex | Reload network
        community.openwrt.service:
            name: network
            state: reloaded

      - name: Fedex | Reload packet steering
        community.openwrt.service:
            name: packet_steering
            state: reloaded

      - name: Fedex | Reload firewall
        community.openwrt.service:
            name: firewall
            state: reloaded

      - name: Fedex | Restart dnsmasq
        community.openwrt.service:
            name: dnsmasq
            state: restarted

      - name: Fedex | Restart sysntpd
        community.openwrt.service:
            name: sysntpd
            state: restarted

      - name: Fedex | Restart dropbear
        community.openwrt.service:
            name: dropbear
            state: restarted

      - name: Fedex | Restart uhttpd
        community.openwrt.service:
            name: uhttpd
            state: restarted

      - name: Fedex | Replay NUT USB hotplug
        community.openwrt.command:
            cmd: |
                for vendor_file in /sys/bus/usb/devices/*/idVendor; do
                    read -r vendorid < "$vendor_file"
                    device="${vendor_file%/idVendor}"
                    read -r productid < "$device/idProduct"
                    [ "$vendorid:$productid" = "{{ nut.ups.vendorid }}:{{ nut.ups.productid }}" ] || continue
                    printf '%s\n' add > "$device/uevent"
                done
            uses_shell: true

      - name: Fedex | Restart NUT server
        community.openwrt.service:
            name: nut-server
            state: restarted

      - name: Fedex | Restart NUT monitor
        community.openwrt.service:
            name: nut-monitor
            state: restarted

      - name: Fedex | Restart Avahi
        community.openwrt.service:
            name: avahi-daemon
            state: restarted
