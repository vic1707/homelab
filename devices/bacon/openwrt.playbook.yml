---
- name: Manage bacon OpenWrt
  hosts: bacon
  gather_facts: false

  vars_files:
      - ../../.config/networks.yml
      - vars/openwrt.yml

  pre_tasks:
      - name: Bacon | Validate shared networks
        ansible.builtin.import_tasks: ../../.config/tasks/validate-networks.yml

      - name: Bacon | Check OpenWrt access
        community.openwrt.ping:

  tasks:
      - name: Bacon | Set root password
        community.openwrt.command:
            cmd: >-
                printf '%s\n%s\n' {{ root_password | quote }} {{ root_password | quote }} | passwd root
            uses_shell: true
        no_log: true

      - name: Bacon | Configure LAN bridge
        community.openwrt.uci:
            command: section
            config: network
            type: device
            name: br_lan
            find:
                name: "{{ bridge.name }}"
            value:
                name: "{{ bridge.name }}"
                type: bridge
                ports: "{{ bridge.ports }}"
            replace: true
            autocommit: true
        notify: Bacon | Reload network

      - name: Bacon | Configure logical networks
        community.openwrt.uci:
            command: section
            config: network
            type: interface
            name: "{{ bacon_network.name }}"
            value:
                device: "{{ bacon_network.device }}"
                proto: "{{ bacon_network.proto }}"
            replace: true
            autocommit: true
        loop: "{{ networks }}"
        loop_control:
            label: "{{ bacon_network.name }}"
            loop_var: bacon_network
        notify: Bacon | Reload network

      - name: Bacon | Configure radios
        community.openwrt.uci:
            command: section
            config: wireless
            type: wifi-device
            name: "{{ bacon_radio.name }}"
            value:
                type: mac80211
                path: "{{ bacon_radio.path }}"
                band: "{{ bacon_radio.band }}"
                country: "{{ bacon_radio.country }}"
                channel: "{{ bacon_radio.channel }}"
                htmode: "{{ bacon_radio.htmode }}"
                disabled: "0"
            replace: true
            autocommit: true
        loop: "{{ radios }}"
        loop_control:
            label: "{{ bacon_radio.name }}"
            loop_var: bacon_radio
        notify: Bacon | Reload wifi

      - name: Bacon | Configure Wi-Fi interfaces
        community.openwrt.uci:
            command: section
            config: wireless
            type: wifi-iface
            name: "{{ bacon_wifi_pair[0].name }}_{{ bacon_wifi_pair[1].name }}"
            value:
                device: "{{ bacon_wifi_pair[1].name }}"
                network: "{{ bacon_wifi_pair[0].network }}"
                mode: ap
                ssid: "{{ bacon_wifi_pair[0].ssid }}"
                encryption: "{{ bacon_wifi_pair[0].encryption }}"
                ieee80211w: "{{ '1' if bacon_wifi_pair[0].ieee80211w | default(false) else '0' }}"
                ieee80211k: "{{ '1' if bacon_wifi_pair[0].ieee80211k | default(false) else '0' }}"
                bss_transition: "{{ '1' if bacon_wifi_pair[0].bss_transition | default(false) else '0' }}"
                rrm_neighbor_report: "{{ '1' if bacon_wifi_pair[0].rrm_neighbor_report | default(false) else '0' }}"
                rrm_beacon_report: "{{ '1' if bacon_wifi_pair[0].rrm_beacon_report | default(false) else '0' }}"
                disabled: "{{ '0' if bacon_wifi_pair[0].enabled else '1' }}"
            replace: true
            keep_keys: key
            autocommit: true
        loop: "{{ wifis | product(radios) | list }}"
        loop_control:
            label: "{{ bacon_wifi_pair[0].name }} on {{ bacon_wifi_pair[1].name }}"
            loop_var: bacon_wifi_pair
        notify: Bacon | Reload wifi

      - name: Bacon | Configure Wi-Fi passphrases
        community.openwrt.uci:
            command: set
            config: wireless
            section: "{{ bacon_wifi_pair[0].name }}_{{ bacon_wifi_pair[1].name }}"
            option: key
            value: "{{ bacon_wifi_pair[0].password }}"
            autocommit: true
        loop: "{{ wifis | product(radios) | list }}"
        loop_control:
            loop_var: bacon_wifi_pair
        no_log: true
        notify: Bacon | Reload wifi

  handlers:
      - name: Bacon | Reload network
        community.openwrt.service:
            name: network
            state: reloaded

      - name: Bacon | Reload wifi
        community.openwrt.command:
            cmd: wifi reload
