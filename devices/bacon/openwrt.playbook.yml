---
- name: Manage bacon OpenWrt
  hosts: bacon
  gather_facts: false
  force_handlers: true

  vars_files:
      - ../../.config/networks.yml
      - ../../.config/cabinet.yml
      - vars/openwrt.yml

  pre_tasks:
      - name: Bacon | Check OpenWrt access
        community.openwrt.ping:

  tasks:
      - name: Bacon | Validate tagged networks
        ansible.builtin.assert:
            that:
                - bacon_tagged_networks | map(attribute='name') | difference(bacon_network_names) | length == 0
                - bacon_network_names | difference(bacon_tagged_networks | map(attribute='name')) | length == 0
            quiet: true

      - name: Bacon | Check root password
        community.openwrt.command:
            cmd: grep -q '^root:[^!*:]' /etc/shadow
            uses_shell: true
        register: bacon_root_password_configured
        changed_when: false
        failed_when: false

      - name: Bacon | Update root password
        community.openwrt.command:
            cmd: >-
                printf '%s\n%s\n' {{ root_password | quote }} {{ root_password | quote }} | passwd root
            uses_shell: true
        no_log: true
        when: bacon_root_password_configured.rc != 0 or bacon_update_root_password | default(false)

      - name: Bacon | Configure tagged VLAN devices
        community.openwrt.uci:
            command: section
            config: network
            type: device
            name: "{{ bacon_network.name }}_vlan"
            value:
                name: "{{ bacon_uplink_device }}.{{ bacon_network.vlan_id }}"
                type: 8021q
                ifname: "{{ bacon_uplink_device }}"
                vid: "{{ bacon_network.vlan_id }}"
            replace: true
            autocommit: true
        loop: "{{ bacon_tagged_networks }}"
        loop_control:
            label: "{{ bacon_network.name }}"
            loop_var: bacon_network
        notify: Bacon | Reload network

      - name: Bacon | Configure client bridges
        community.openwrt.uci:
            command: section
            config: network
            type: device
            name: "{{ bacon_network.name }}_bridge"
            value:
                name: "br-{{ bacon_network.name | replace('_', '-') }}"
                type: bridge
                ports:
                    - "{{ bacon_uplink_device }}.{{ bacon_network.vlan_id }}"
            replace: true
            autocommit: true
        loop: "{{ bacon_client_networks }}"
        loop_control:
            label: "{{ bacon_network.name }}"
            loop_var: bacon_network
        notify: Bacon | Reload network

      - name: Bacon | Configure Wi-Fi bridge-port isolation
        community.openwrt.uci:
            command: section
            config: network
            type: device
            name: "{{ bacon_wifi_pair[0].name }}_{{ bacon_wifi_pair[1].name }}_device"
            value:
                name: "{{ bacon_wifi_pair[1].name }}-{{ bacon_wifi_pair[0].name }}"
                isolate: "{{ '1' if bacon_wifi_pair[0].isolate | default(false) else '0' }}"
            replace: true
            autocommit: true
        loop: "{{ wifis | product(radios) | list }}"
        loop_control:
            label: "{{ bacon_wifi_pair[0].name }} on {{ bacon_wifi_pair[1].name }}"
            loop_var: bacon_wifi_pair
        notify: Bacon | Reload network

      - name: Bacon | Configure tagged logical networks
        community.openwrt.uci:
            command: section
            config: network
            type: interface
            name: "{{ bacon_network.name }}"
            value:
                device: >-
                    {{ bacon_uplink_device ~ '.' ~ bacon_network.vlan_id
                       if bacon_network.name == 'mgmt'
                       else 'br-' ~ (bacon_network.name | replace('_', '-')) }}
                proto: "{{ 'dhcp' if bacon_network.name == 'mgmt' else 'none' }}"
            replace: true
            autocommit: true
        loop: "{{ bacon_tagged_networks }}"
        loop_control:
            label: "{{ bacon_network.name }}"
            loop_var: bacon_network
        notify: Bacon | Reload network

      - name: Bacon | Configure radios
        community.openwrt.uci:
            command: section
            config: wireless
            type: wifi-device
            name: "{{ bacon_radio.name }}"
            value:
                type: mac80211
                path: "{{ bacon_radio.path }}"
                band: "{{ bacon_radio.band }}"
                country: "{{ bacon_radio.country }}"
                channel: "{{ bacon_radio.channel }}"
                htmode: "{{ bacon_radio.htmode }}"
                disabled: "0"
            replace: true
            autocommit: true
        loop: "{{ radios }}"
        loop_control:
            label: "{{ bacon_radio.name }}"
            loop_var: bacon_radio
        notify: Bacon | Reload wifi

      - name: Bacon | Configure Wi-Fi interfaces
        community.openwrt.uci:
            command: section
            config: wireless
            type: wifi-iface
            name: "{{ bacon_wifi_pair[0].name }}_{{ bacon_wifi_pair[1].name }}"
            value:
                device: "{{ bacon_wifi_pair[1].name }}"
                ifname: "{{ bacon_wifi_pair[1].name }}-{{ bacon_wifi_pair[0].name }}"
                network: "{{ bacon_wifi_pair[0].network }}"
                mode: ap
                ssid: "{{ bacon_wifi_pair[0].ssid }}"
                encryption: "{{ bacon_wifi_pair[0].encryption }}"
                ieee80211w: "{{ '1' if bacon_wifi_pair[0].ieee80211w | default(false) else '0' }}"
                ieee80211k: "{{ '1' if bacon_wifi_pair[0].ieee80211k | default(false) else '0' }}"
                bss_transition: "{{ '1' if bacon_wifi_pair[0].bss_transition | default(false) else '0' }}"
                rrm_neighbor_report: "{{ '1' if bacon_wifi_pair[0].rrm_neighbor_report | default(false) else '0' }}"
                rrm_beacon_report: "{{ '1' if bacon_wifi_pair[0].rrm_beacon_report | default(false) else '0' }}"
                isolate: "{{ '1' if bacon_wifi_pair[0].isolate | default(false) else '0' }}"
                disabled: "{{ '0' if bacon_wifi_pair[0].enabled else '1' }}"
            replace: true
            keep_keys: key
            autocommit: true
        loop: "{{ wifis | product(radios) | list }}"
        loop_control:
            label: "{{ bacon_wifi_pair[0].name }} on {{ bacon_wifi_pair[1].name }}"
            loop_var: bacon_wifi_pair
        notify: Bacon | Reload wifi

      - name: Bacon | Configure Wi-Fi passphrases
        community.openwrt.uci:
            command: set
            config: wireless
            section: "{{ bacon_wifi_pair[0].name }}_{{ bacon_wifi_pair[1].name }}"
            option: key
            value: "{{ bacon_wifi_pair[0].password }}"
            autocommit: true
        loop: "{{ wifis | product(radios) | list }}"
        loop_control:
            loop_var: bacon_wifi_pair
        no_log: true
        notify: Bacon | Reload wifi

      - name: Bacon | Remove legacy logical networks
        community.openwrt.uci:
            command: absent
            config: network
            section: "{{ bacon_legacy_network }}"
            autocommit: true
        loop:
            - lan
            - guest
            - iot
        loop_control:
            loop_var: bacon_legacy_network
        notify: Bacon | Reload network

      - name: Bacon | Remove legacy LAN bridge
        community.openwrt.uci:
            command: absent
            config: network
            type: device
            find:
                name: br-lan
            autocommit: true
        notify: Bacon | Reload network

      - name: Bacon | Restrict SSH to tagged management
        community.openwrt.uci:
            command: set
            config: dropbear
            section: "@dropbear[0]"
            option: Interface
            value: mgmt
            autocommit: true
        notify: Bacon | Restart dropbear

  handlers:
      - name: Bacon | Reload network
        community.openwrt.service:
            name: network
            state: reloaded

      - name: Bacon | Reload wifi
        community.openwrt.command:
            cmd: wifi reload

      - name: Bacon | Restart dropbear
        community.openwrt.service:
            name: dropbear
            state: restarted
