name: Build & Push Custom Container Images

on:
  push:
    branches: [main]
    paths:
      - &containerfiles-paths ".custom-containers/**/*.containerfile"
  pull_request:
    types:
      - opened
      - closed
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - *containerfiles-paths
  workflow_dispatch:
    inputs:
      containerfile:
        description: The container to build
        type: string

permissions: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  detect-changes:
    name: Detect changed containerfiles
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request_target' && github.event.action != 'closed' }}
    outputs:
      containerfiles: ${{ steps.set-containerfiles.outputs.containerfiles }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get changed containerfiles paths
        if: ${{ github.event_name != 'workflow_dispatch' }}
        id: changed-containerfiles
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: *containerfiles-paths
          matrix: true

      - name: Workflow Dispatch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        id: manual-containerfile
        env:
          CONTAINER_FILE: ${{ inputs.containerfile }}
        run: |
          if [ ! -f "$CONTAINER_FILE" ]; then
            echo "Containerfile '$CONTAINER_FILE' not found!"
            exit 1
          fi
          echo "containerfiles=[\"$CONTAINER_FILE\"]" >> "$GITHUB_OUTPUT"

      - name: Set containerfiles
        id: set-containerfiles
        env:
          CHANGED_FILES: ${{ steps.changed-containerfiles.outputs.all_changed_files }}
          MANUAL: ${{ steps.manual-containerfile.outputs.containerfiles }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "containerfiles=$MANUAL" >> "$GITHUB_OUTPUT"
          else
            echo "containerfiles=$CHANGED_FILES" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build & Push custom containers
    needs: detect-changes
    runs-on: ubuntu-latest
    if: ${{ needs.detect-changes.outputs.containerfiles != '[]' }}
    strategy:
      matrix:
        file: ${{ fromJson(needs.detect-changes.outputs.containerfiles) }}
      max-parallel: 4
      fail-fast: false
    permissions:
      packages: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: ${{ env.PLATFORMS }}

      - name: Determine tags and image name
        id: set-env
        env:
          CONTAINER_FILE: ${{ matrix.file }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            tags="pr-${{ github.event.pull_request.number }}"
          else
            version="$(sed -n 's/^[[:space:]]*ARG VERSION=//p' "$CONTAINER_FILE" | tail -1)"
            tags="${version:-latest}"
          fi

          echo "image=$(basename "$CONTAINER_FILE" .containerfile)" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: Get build dir
        id: build-dir
        env:
          CONTAINER_FILE: ${{ matrix.file }}
        run: echo "build-dir=$(dirname "$CONTAINER_FILE")" >> "$GITHUB_OUTPUT"

      - name: Build Image
        id: build_image
        uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034 # v3.1.0
        with:
          extra-args: --network=host
          image: ${{ steps.set-env.outputs.image }}
          tags: ${{ steps.set-env.outputs.tags }}
          platforms: ${{ env.PLATFORMS }}
          containerfiles: ${{ matrix.file }}
          context: ${{ steps.build-dir.outputs.build-dir }}
          layers: true
          # needs to be in sync with check job --format
          oci: false

      - name: Push to ghcr.io
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v3.0.0
        with:
          image: ${{ steps.build_image.outputs.image }}
          tags: ${{ steps.build_image.outputs.tags }}
          registry: ghcr.io/${{ github.repository_owner }}/homelab
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  cleanup-pr-images:
    name: Cleanup PR images
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' }}
    permissions:
      packages: write
    steps:
      - name: Delete PR images from GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          TAG="pr-$PR"

          echo "Deleting images with tag: $TAG"

          IDS=$(gh api "/orgs/$OWNER/packages/container/homelab/versions" \
              --paginate \
              | jq -r --arg tag "$TAG" '.[] | select(.metadata.container.tags[]? == $tag) | .id')

          if [ -z "$IDS" ]; then
              echo "No images found for tag $TAG"
              exit 0
          fi

          for id in $IDS; do
              echo "Deleting version $id"
              gh api \
                  -X DELETE \
                  "/orgs/$OWNER/packages/container/homelab/versions/$id"
          done
