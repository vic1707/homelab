name: Build OpenWrt images

on:
  push:
    branches: [main]
    paths:
      - ".openwrt-base/**"
      - ".ssh-keys/**"
      - "devices/**/openwrt.env"
      - "devices/**/files/**"
      - ".github/workflows/build-openwrt.yml"
  workflow_dispatch:
    inputs:
      preset:
        description: OpenWrt preset env file to build
        required: true
        default: devices/bacon/openwrt.env

permissions: {}

concurrency:
  group: openwrt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select-presets:
    name: Select OpenWrt presets
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      presets: ${{ steps.presets.outputs.presets }}
      has_presets: ${{ steps.presets.outputs.has_presets }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Get changed OpenWrt files
        if: ${{ github.event_name == 'push' }}
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            .openwrt-base/**
            .ssh-keys/**
            devices/**/openwrt.env
            devices/**/files/**
            .github/workflows/build-openwrt.yml

      - name: Select presets
        id: presets
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
          DISPATCH_PRESET: ${{ inputs.preset }}
        run: |
          presets_file="$(mktemp)"

          all_presets() {
            find devices -mindepth 2 -maxdepth 2 -name openwrt.env
          }

          add_preset() {
            local preset="$1"
            [ -f "$preset" ] || return 0
            printf '%s\n' "$preset" >> "$presets_file"
          }

          preset_base() {
            sed -n -E "s/^[[:space:]]*OPENWRT_BASE[[:space:]]*=[[:space:]]*['\"]?([^'\"#[:space:]]+)['\"]?.*/\1/p" "$1" | tail -n 1
          }

          add_presets_using_base() {
            local base="$1" preset
            while IFS= read -r preset; do
              [ "$(preset_base "$preset")" = "$base" ] && add_preset "$preset"
            done < <(all_presets)
          }

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            test -f "$DISPATCH_PRESET"
            printf '%s\n' "$DISPATCH_PRESET" > "$presets_file"
          else
            for file in $CHANGED_FILES; do
              case "$file" in
                .github/workflows/build-openwrt.yml|.openwrt-base/build.sh)
                  all_presets >> "$presets_file"
                  ;;
                .openwrt-base/*)
                  base_path="${file#.openwrt-base/}"
                  case "$base_path" in
                    */*) add_presets_using_base "${base_path%%/*}" ;;
                    *) all_presets >> "$presets_file" ;;
                  esac
                  ;;
                devices/*/openwrt.env)
                  add_preset "$file"
                  ;;
                devices/*/files/*)
                  add_preset "${file%%/files/*}/openwrt.env"
                  ;;
                .ssh-keys/*)
                  grep -R -l -F "$file" devices/*/openwrt.env >> "$presets_file" || true
                  ;;
              esac
            done
          fi

          presets="$(sort -u "$presets_file" | jq -R -s -c 'split("\n") | map(select(length > 0)) | map({preset: ., device: (split("/")[-2])}) | {include: .}')"
          echo "presets=$presets" >> "$GITHUB_OUTPUT"

          if [ "$(jq '.include | length' <<< "$presets")" -gt 0 ]; then
            echo "has_presets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_presets=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build OpenWrt ${{ matrix.device }}
    needs: select-presets
    runs-on: ubuntu-24.04
    if: ${{ needs.select-presets.outputs.has_presets == 'true' }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.select-presets.outputs.presets) }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Build OpenWrt image
        env:
          PRESET: ${{ matrix.preset }}
        run: .openwrt-base/build.sh --out-dir dist/openwrt "$PRESET"

      - name: Publish releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="$(find dist/openwrt -type f -name '*-sysupgrade.bin' | sort)"
          name="$(basename "$image")"
          device="${name%%-openwrt-*}"
          version="${name#"$device-openwrt-"}"
          version="${version%-sysupgrade.*}"
          tag="openwrt-$device-$version"
          title="OpenWrt $device $version"

          if ! gh release view "$tag" > /dev/null 2>&1; then
            gh release create "$tag" \
              --title "$title" \
              --notes "Custom OpenWrt sysupgrade image for $device on $version."
          fi

          gh release upload "$tag" "$image" --clobber
