---
networks:
    - name: rescue
      vlan_id: null
      subnet: 192.168.255.0/24
      gateway: 192.168.255.1
      dhcp:
          start: 100
          limit: 50
          leasetime: 1h
          default_route: false
          routes: [mgmt, automation, iot_cloud] # zones that can reply to rescue

    - name: mgmt
      vlan_id: 10
      subnet: 10.0.10.0/24
      gateway: 10.0.10.1
      addresses:
          mycelium: 10.0.10.2
      dhcp:
          start: 200
          limit: 21
          leasetime: 12h
          default_route: false # Keep another interface as the controller's internet route.

    - name: user
      vlan_id: 20
      subnet: 10.0.20.0/24
      gateway: 10.0.20.1
      dhcp:
          start: 50
          limit: 205
          leasetime: 12h

    - name: automation
      vlan_id: 30
      subnet: 10.0.30.0/24
      gateway: 10.0.30.1
      dhcp:
          start: 50
          limit: 205
          leasetime: 12h

    - name: iot_offline
      vlan_id: 31
      subnet: 10.0.31.0/24
      gateway: 10.0.31.1
      dhcp:
          start: 50
          limit: 205
          leasetime: 12h

    - name: iot_cloud
      vlan_id: 32
      subnet: 10.0.32.0/24
      gateway: 10.0.32.1
      dhcp:
          start: 50
          limit: 205
          leasetime: 12h

    - name: untrusted
      vlan_id: 40
      subnet: 10.0.40.0/24
      gateway: 10.0.40.1
      dhcp:
          start: 50
          limit: 205
          leasetime: 12h

    - name: parking
      vlan_id: 999
      subnet: null
      gateway: null

