---
- name: Validate shared network intent
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
      - networks.yml
      - cabinet.yml
      - ../devices/fedex/vars/static_hosts.yml
      - ../devices/fedex/vars/firewall.yml

  tasks:
      - name: Validate network registry
        ansible.builtin.import_tasks: validate.tasks.yml

      - name: Validate Fedex firewall intent
        ansible.builtin.import_tasks: validate.firewall.tasks.yml
